name: Build Quotation Studio Windows Installer

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'windows-app/**'
      - '.github/workflows/build-quotation-studio.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows-app/QuotationStudio/QuotationStudio.csproj

      - name: Publish self-contained single file
        run: dotnet publish windows-app/QuotationStudio/QuotationStudio.csproj -c Release -r win-x64 --self-contained true --no-restore

      - name: Verify publish output and run self-test
        shell: powershell
        run: |
          $exe = "windows-app\QuotationStudio\bin\Release\net10.0-windows\win-x64\publish\QuotationStudio.exe"
          if (!(Test-Path $exe)) { throw "Published EXE was not generated" }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Application self-test failed with exit code $($p.ExitCode)" }
          Write-Host "Self-test passed. EXE size: $([math]::Round((Get-Item $exe).Length/1MB,2)) MB"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "windows-app\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Install generated Setup and test installed application
        shell: powershell
        run: |
          $installer = Get-ChildItem "windows-app\dist\QuotationStudio-Setup-*.exe" | Select-Object -First 1
          if (!$installer) { throw "Installer was not generated" }
          $testDir = Join-Path $env:TEMP "QuotationStudioInstalled"
          if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$testDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $testDir "QuotationStudio.exe"
          if (!(Test-Path $installedExe)) { throw "Installed EXE not found" }
          $test = Start-Process -FilePath $installedExe -ArgumentList "--self-test" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Installed application self-test failed with exit code $($test.ExitCode)" }
          Write-Host "Installer smoke test passed: $($installer.FullName) / $([math]::Round($installer.Length/1MB,2)) MB"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: QuotationStudio-Windows-Installer-v3
          path: windows-app/dist/QuotationStudio-Setup-3.0.0.exe
          if-no-files-found: error
