name: Dashboard UX Upgrade

on:
  push:
    paths:
      - ".github/workflows/dashboard-ux-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply dashboard UX improvements
        run: python .github/scripts/dashboard_ux_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit verified dashboard upgrade
        shell: bash
        run: |
          git config user.name "abdulazizalsari"
          git config user.email "tr.abdulazizalsari@gmail.com"
          git rm .github/workflows/dashboard-ux-upgrade.yml .github/scripts/dashboard_ux_patch.py
          git add app/dashboard/Dashboard.tsx app/dashboard/RichTextEditor.tsx 'app/dashboard/[...module]/page.tsx' app/globals.css
          git commit -m "Improve dashboard UX and mobile editor"
          git push
