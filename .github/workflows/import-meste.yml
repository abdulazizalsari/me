name: Import Verified Meste Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-6090-820a-a41e-586cd58f15e5/raw?se=2026-09-19T17%3A52%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=2172482f-1775-51f9-8440-5f2fc11aafb6&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T06%3A09%3A42Z&ske=2026-09-20T06%3A09%3A42Z&sks=b&skv=2026-02-06&sig=WnhUc3SJGV9yF/4wIZ%2BxwM3zkxJGACJuyTf9kQFl0jo%3D' -o /tmp/meste-source.zip
          mkdir -p /tmp/meste-artifact
          unzip -q /tmp/meste-source.zip -d /tmp/meste-artifact
          test -f /tmp/meste-artifact/meste-vercel-source.tar.gz

      - name: Replace old Vercel repository with verified source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} + 2>/dev/null || true
          find .github/workflows -type f ! -name import-meste.yml -delete 2>/dev/null || true
          tar -xzf /tmp/meste-artifact/meste-vercel-source.tar.gz -C .
          rm -f .github/workflows/import-meste.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          test -f app/page.tsx
          test -f lib/supabase-config.ts
          npm ci
          npm run typecheck
          npm run build

      - name: Commit deployable source
        shell: bash
        run: |
          git config user.name 'OpenAI Deployment Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy verified Supabase build to Vercel'
          git push origin HEAD:main
